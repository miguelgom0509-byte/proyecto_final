<style>
/* ==========================================================================
   Moto Altiplano — hoja de estilos única
   1. Tokens        2. Base         3. Utilidades    4. Cabecera
   5. Portada       6. Buscador     7. Secciones     8. Catálogo
   9. Financiamiento 10. Paneles     11. Pie          12. Comparador
   13. Diálogos     14. Avisos       15. Adaptación
   ========================================================================== */

/* 1. Tokens ---------------------------------------------------------------- */
:root{
  color-scheme:light;
  --bg:#EDF0F3;
  --surface:#FFFFFF;
  --surface-2:#F5F7F9;
  --ink:#111A24;
  --muted:#55636F;
  --line:#C9D2DA;
  --line-soft:#DDE3E9;
  --accent:#D63E16;
  --accent-hover:#B93311;
  --accent-soft:#FBEAE4;
  --accent-ink:#FFFFFF;
  --deep:#101B25;
  --deep-2:#0A1219;
  --deep-line:#283643;
  --deep-ink:#F2F5F8;
  --deep-muted:#A3B1BE;
  --ok:#0E6B57;
  --chip:#E4E9EE;
  --shade:rgba(6,11,16,.66);
  --radius:14px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(16,27,37,.06),0 2px 6px -2px rgba(16,27,37,.09);
  --shadow-md:0 20px 44px -26px rgba(16,27,37,.5);
  --header-h:64px;
  --maxw:1180px;
  --gutter:clamp(16px,4vw,32px);
  --f-display:'Saira Extra Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C131A; --surface:#141E27; --surface-2:#101A22;
    --ink:#EAF0F5; --muted:#9EACB9; --line:#28353F; --line-soft:#22303A;
    --accent:#FF7A4D; --accent-hover:#FF9068; --accent-soft:#2B1A13; --accent-ink:#1A0F0A;
    --deep:#060C12; --deep-2:#04090E; --deep-line:#21303B;
    --deep-ink:#EAF0F5; --deep-muted:#94A2AF;
    --ok:#4FD1AE; --chip:#1C2A35;
    --shade:rgba(2,6,10,.78);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow-md:0 22px 50px -28px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C131A; --surface:#141E27; --surface-2:#101A22;
  --ink:#EAF0F5; --muted:#9EACB9; --line:#28353F; --line-soft:#22303A;
  --accent:#FF7A4D; --accent-hover:#FF9068; --accent-soft:#2B1A13; --accent-ink:#1A0F0A;
  --deep:#060C12; --deep-2:#04090E; --deep-line:#21303B;
  --deep-ink:#EAF0F5; --deep-muted:#94A2AF;
  --ok:#4FD1AE; --chip:#1C2A35;
  --shade:rgba(2,6,10,.78);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 22px 50px -28px rgba(0,0,0,.9);
}

/* 2. Base ------------------------------------------------------------------ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--header-real,var(--header-h)) + 16px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body.no-scroll{overflow:hidden}
img,svg{max-width:100%}
h1,h2,h3{
  font-family:var(--f-display);font-weight:800;text-transform:uppercase;
  line-height:.94;letter-spacing:.01em;margin:0;text-wrap:balance;
}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent);color:var(--accent-ink)}

/* 3. Utilidades ------------------------------------------------------------ */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:max(var(--gutter),env(safe-area-inset-left,0px))}
.wrap{padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.note{font-size:.82rem;color:var(--muted);line-height:1.45}
.eyebrow{
  font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;color:var(--accent);margin-bottom:.5rem;
}
.skip-link{
  position:fixed;left:12px;top:-80px;z-index:200;background:var(--accent);color:var(--accent-ink);
  padding:.7rem 1rem;border-radius:var(--radius-sm);font-weight:700;text-decoration:none;
  transition:top .15s ease;
}
.skip-link:focus{top:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:44px;padding:.6rem 1.1rem;border:2px solid transparent;
  border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;transition:background .15s,border-color .15s,color .15s,transform .15s;
}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.on-deep{background:transparent;color:var(--deep-ink);border-color:var(--deep-line)}
.btn.on-deep:hover{background:rgba(255,255,255,.08);border-color:var(--deep-muted)}
.btn.sm{min-height:40px;font-size:.74rem;padding:.45rem .8rem;flex:1 1 auto}
.btn.block{width:100%}
.icon-btn{
  display:inline-grid;place-items:center;width:40px;height:40px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--muted)}
.pill-btn{
  display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap;
  background:transparent;border:1px solid var(--deep-line);color:var(--deep-ink);
  border-radius:999px;padding:.4rem .8rem;font-size:.82rem;font-weight:600;
  transition:border-color .15s,background .15s;
}
.pill-btn:hover{border-color:var(--deep-muted);background:rgba(255,255,255,.06)}
.pill-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill-btn b{font-variant-numeric:tabular-nums}
.link-btn{
  background:none;border:0;padding:.35rem 0;color:var(--muted);
  font-weight:600;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;
}
.link-btn:hover{color:var(--accent)}
.cur{display:inline-flex;border:1px solid var(--deep-line);border-radius:999px;overflow:hidden}
.cur button{
  background:transparent;border:0;color:var(--deep-ink);padding:.4rem .7rem;
  font-weight:700;font-size:.8rem;min-height:36px;
}
.cur button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* 4. Cabecera -------------------------------------------------------------- */
.top{
  position:sticky;top:0;z-index:50;
  background:var(--deep);color:var(--deep-ink);
  border-bottom:3px solid var(--accent);
}
.top-inner{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;min-height:var(--header-h);padding-block:.5rem}
.logo{
  display:inline-flex;align-items:center;gap:.5rem;flex:0 0 auto;
  font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1;
  text-transform:uppercase;letter-spacing:.02em;text-decoration:none;
}
.logo-mark{width:.85rem;height:1.05rem;background:var(--accent);transform:skewX(-18deg);border-radius:2px}
.nav{display:flex;align-items:center;gap:.15rem;flex:1 1 auto;order:2}
.nav a{
  text-decoration:none;color:var(--deep-muted);font-size:.88rem;font-weight:600;
  padding:.45rem .55rem;border-radius:var(--radius-sm);white-space:nowrap;
}
.nav a:hover{color:var(--deep-ink);background:rgba(255,255,255,.06)}
.nav .pill-btn{margin-left:.35rem}
.top-actions{display:flex;align-items:center;gap:.5rem;margin-left:auto;order:3}
.top .icon-btn{background:transparent;border-color:var(--deep-line);color:var(--deep-ink)}
.top .icon-btn:hover{background:rgba(255,255,255,.08);border-color:var(--deep-muted)}

/* 5. Portada --------------------------------------------------------------- */
.hero{
  position:relative;overflow:hidden;
  background:radial-gradient(125% 120% at 88% 0%,#1E3242 0%,var(--deep) 52%,var(--deep-2) 100%);
  color:var(--deep-ink);
  padding-block:clamp(2.4rem,6vw,4.4rem) 0;
}
.hero::before{
  content:"";position:absolute;inset:auto 0 0;height:60%;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 14px);
}
.hero-inner{position:relative;z-index:1}
.hero-art{position:absolute;right:0;top:.6rem;width:min(520px,44vw);pointer-events:none;z-index:0}
.hero-art::before{content:"";position:absolute;inset:-14%;background:radial-gradient(closest-side,rgba(255,122,77,.3),rgba(255,122,77,0) 72%)}
.hero-art img{position:relative;width:100%;height:auto;display:block;filter:drop-shadow(0 30px 48px rgba(0,0,0,.55))}
@media (max-width:760px){.hero-art{display:none}}
.hero h1{font-size:clamp(2.7rem,8vw,5.6rem);max-width:15ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .sub{color:var(--deep-muted);font-size:clamp(1rem,2.2vw,1.13rem);margin-top:1rem;max-width:48ch}
.stats{display:flex;flex-wrap:wrap;gap:1.4rem 2rem;list-style:none;padding:0;margin:1.7rem 0 0}
.stats li{display:grid;gap:.1rem}
.stats strong{font-family:var(--f-display);font-size:2rem;line-height:1;font-weight:700}
.stats span{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--deep-muted)}
.hero-cta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.6rem}

/* 6. Buscador -------------------------------------------------------------- */
.finder{
  position:relative;margin-top:clamp(1.8rem,4vw,2.6rem);
  background:var(--surface);color:var(--ink);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:clamp(1.1rem,3vw,1.7rem);
  display:grid;gap:1.1rem;box-shadow:var(--shadow-md);
}
.finder h2{font-size:clamp(1.35rem,3.4vw,1.85rem)}
.finder .note{max-width:62ch}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;align-items:end}
.field{display:grid;gap:.35rem;min-width:0}
.field > label{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.field output{font-weight:700;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;color:var(--ink)}
.field select,.field input[type="text"],.field input[type="tel"],.field input[type="email"]{
  width:100%;min-height:44px;padding:.6rem .75rem;
  border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface-2);
}
.field input[type="range"]{width:100%;accent-color:var(--accent);min-height:32px}
.field .hint{font-size:.75rem;color:var(--muted)}
.search-wrap{position:relative;display:flex}
.search-wrap input{padding-right:2.6rem!important}
.search-clear{
  position:absolute;right:.35rem;top:50%;transform:translateY(-50%);
  width:32px;height:32px;display:grid;place-items:center;
  border:0;border-radius:50%;background:var(--chip);color:var(--muted);
}
.search-clear:hover{background:var(--accent);color:var(--accent-ink)}
.finder-actions{display:flex;gap:.8rem;align-items:end;flex-wrap:wrap}
.finder-actions .field{flex:1 1 280px}
.finder-actions .btn{flex:0 0 auto}
@media (max-width:640px){.finder-actions .btn{width:100%}}

/* 7. Secciones ------------------------------------------------------------- */
section{padding-block:clamp(2.6rem,6vw,4.2rem)}
section[id]{scroll-margin-top:calc(var(--header-real,var(--header-h)) + 16px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:1rem 2rem;flex-wrap:wrap;margin-bottom:clamp(1.2rem,3vw,1.9rem)}
.sec-head h2{font-size:clamp(1.9rem,5vw,2.9rem)}
.sec-head .note{max-width:52ch}
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:.75rem}
.style-btn{
  position:relative;text-align:left;display:grid;gap:.15rem;align-content:start;
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:1rem 1rem 1.1rem;min-width:0;transition:border-color .15s,background .15s,transform .15s;
}
.style-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.style-btn strong{font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;line-height:1;font-weight:700}
.style-btn small{color:var(--muted);font-size:.84rem;line-height:1.35}
.style-btn .count{
  position:absolute;right:.7rem;top:.7rem;font-size:.7rem;font-weight:700;
  color:var(--muted);background:var(--chip);border-radius:999px;padding:.1rem .45rem;
}
.style-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.style-btn[aria-pressed="true"] small,.style-btn[aria-pressed="true"] .count{color:inherit}
.style-btn[aria-pressed="true"] .count{background:rgba(0,0,0,.16)}
.brands{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  display:inline-flex;align-items:center;gap:.4rem;min-height:40px;
  border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.35rem .9rem;font-weight:600;font-size:.9rem;transition:border-color .15s,background .15s,color .15s;
}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.78rem}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

/* 8. Catálogo -------------------------------------------------------------- */
.active-filters{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin-bottom:1rem}
.active-filters .af-label{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.af-chip{
  display:inline-flex;align-items:center;gap:.35rem;border:1.5px solid var(--accent);
  background:var(--accent-soft);color:var(--accent);border-radius:999px;
  padding:.2rem .35rem .2rem .7rem;font-size:.82rem;font-weight:600;max-width:100%;
}
.af-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af-chip .x{display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:50%;background:transparent;color:inherit}
.af-chip .x:hover{background:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:.9rem 1.2rem;margin-bottom:1.3rem;padding-bottom:1.1rem;border-bottom:1px solid var(--line-soft)}
.toolbar .count{font-size:.95rem;color:var(--muted);margin-right:auto}
.toolbar .count strong{color:var(--ink);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tool{display:grid;gap:.3rem}
.tool > label{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tool select,.rate-box input{
  min-height:44px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface);padding:.5rem .65rem;
}
.rate-box{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--muted)}
.rate-box input{width:76px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:1.1rem}
.card{
  display:flex;flex-direction:column;min-width:0;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
@media (prefers-reduced-motion:no-preference){
  .card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--line)}
  .card:focus-within{box-shadow:var(--shadow-md)}
}
.art{
  position:relative;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
  overflow:hidden;width:100%;padding:.6rem;
  background:linear-gradient(160deg,var(--chip) 0%,var(--surface-2) 100%);
}
.art svg{width:94%;height:auto;display:block}
.art.has-photo{background:linear-gradient(170deg,#FFFFFF 0%,#F4F6F8 58%,#E7ECF0 100%)}
.art.has-photo .bike-img{width:100%;height:100%;object-fit:contain;padding:4% 6%;filter:drop-shadow(0 12px 20px rgba(16,27,37,.13))}
.art img.upload-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;padding:0}
.art .tag{
  position:absolute;left:.6rem;top:.6rem;z-index:2;
  background:var(--deep);color:var(--deep-ink);font-size:.66rem;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;padding:.22rem .45rem;border-radius:4px;
}
.art .heart{
  position:absolute;right:.55rem;top:.55rem;z-index:2;width:38px;height:38px;
  display:grid;place-items:center;border:0;border-radius:50%;
  background:var(--surface);color:var(--muted);box-shadow:var(--shadow-sm);
}
.art .heart:hover{color:var(--accent)}
.art .heart[aria-pressed="true"]{color:var(--accent)}
.art .photo-btn{
  position:absolute;right:.55rem;bottom:.55rem;z-index:2;display:inline-flex;align-items:center;gap:.3rem;
  background:rgba(10,18,25,.82);color:#fff;font-size:.68rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:.3rem .45rem;cursor:pointer;
}
.art .photo-btn:hover{background:var(--accent)}
.art .photo-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.card .body{padding:1rem 1.05rem 1.1rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.brand-line{font-size:.71rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;gap:.35rem;flex-wrap:wrap}
.card h3{font-size:1.5rem;line-height:1.02}
.card h3 button{
  background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;
  text-transform:inherit;letter-spacing:inherit;line-height:inherit;
}
.card h3 button:hover{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.specs{display:flex;flex-wrap:wrap;gap:.35rem}
.specs span{background:var(--chip);border-radius:5px;padding:.15rem .45rem;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.price-block{margin-top:auto;padding-top:.35rem;display:grid;gap:.15rem}
.price{font-family:var(--f-display);font-size:1.95rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-family:var(--f-body);font-size:.74rem;font-weight:500;color:var(--muted);margin-left:.3rem;letter-spacing:0}
.cuota{font-size:.88rem;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.card .actions{display:flex;gap:.5rem;align-items:stretch;flex-wrap:wrap;margin-top:.35rem}
.cmp-toggle{
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  min-height:40px;padding:.45rem .7rem;flex:0 0 auto;
  border:1.5px solid var(--line);border-radius:var(--radius-sm);

/* Diálogo accesible: foco atrapado, Escape, bloqueo de scroll y foco devuelto. */
function Modal(p){
  var box=useRef(null);
  useEffect(function(){
    if(!p.open) return;
    var node=box.current, previous=document.activeElement;
    var sel='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
    function onKey(e){
      if(e.key==='Escape'){e.preventDefault();p.onClose();return}
      if(e.key!=='Tab'||!node) return;
      var items=Array.prototype.filter.call(node.querySelectorAll(sel),function(el){return el.getClientRects().length>0});
      if(!items.length) return;
      var first=items[0], last=items[items.length-1];
      if(e.shiftKey&&(document.activeElement===first||!node.contains(document.activeElement))){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
    document.addEventListener('keydown',onKey,true);
    document.body.classList.add('no-scroll');
    var t=setTimeout(function(){var f=node&&node.querySelector(sel);if(f)f.focus()},0);
    return function(){
      clearTimeout(t);
      document.removeEventListener('keydown',onKey,true);
      document.body.classList.remove('no-scroll');
      if(previous&&previous.focus) previous.focus();
    };
  },[p.open]);
  if(!p.open) return null;
  return h('div',{className:'modal',onMouseDown:function(e){if(e.target===e.currentTarget)p.onClose()}},
    h('div',{className:'modal-box',ref:box,role:'dialog','aria-modal':'true','aria-labelledby':p.titleId},
      h('div',{className:'modal-head'},
        h('h2',{id:p.titleId},p.title),
        h('button',{className:'icon-btn modal-close',type:'button','aria-label':'Cerrar','onClick':p.onClose},h(Icon,{d:[P.close]}))),
      p.children));
}

    h('div',{inert:modalOpen?'':undefined,'aria-hidden':modalOpen?'true':undefined},
      header,
      h('main',null,heroShell(finder),stylesSec,brandsSec,catalog,fin,panels),
      footer,
      bar),
    detailView,
    cmpView,
    toastEl);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
