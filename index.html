      h('div',{className:'detail'},

          h(Photo,{m:dm,photos:photos,fav:favs.indexOf(dm.id)>-1,onFav:function(){toggleFav(dm.id)},onUpload:upload}),
          photos[dm.id]&&h('button',{className:'btn ghost',type:'button',style:{color:'var(--ink)'},onClick:function(){removePhoto(dm.id)}},'Quitar foto'),

        h('div',{className:'dside'},
          h('div',null,h('div',{className:'price'},price(dm)),h('div',{className:'cuota'},'Desde '+money(cuotaOf(dm,20,24,35),cur)+' al mes (20% de inicial, 24 meses)')),

            h('dt',null,'Estilo'),h('dd',null,STYLE_NAME[dm.style]),h('dt',null,'Precio de lista'),h('dd',null,money(dm.price,dm.cur)+(dm.cur==='USD'?' (dólares)':' (soles)'))),
          h('div',{className:'actions'},
            h('button',{className:'btn',type:'button',onClick:function(){setS({id:dm.id});setDetail(null);goto('financiamiento')}},'Simular crédito'),
            h('button',{className:'btn ghost',type:'button',style:{color:'var(--ink)'},onClick:function(){toggleCmp(dm.id)}},cmp.indexOf(dm.id)>-1?'Quitar del comparador':'Comparar'))))));

  /* comparador */
  var cmpView=cmpOpen&&cmp.length>=2&&h('div',{className:'modal',role:'dialog','aria-modal':true,'aria-labelledby':'cTitle',onClick:function(e){if(e.target===e.currentTarget)setCmpOpen(false)}},
    h('div',{className:'modal-box'},
      h('div',{className:'modal-head'},h('h2',{id:'cTitle'},'Comparador'),h('button',{className:'btn ghost',type:'button',onClick:function(){setCmpOpen(false)}},'Cerrar')),
      h('div',{className:'tbl'},(function(){
        var ms=cmp.map(byId);
        var rows=[['Tipo',function(m){return m.type}],['Año',function(m){return m.year}],['Cilindrada',function(m){return m.cc+' cc'}],['Potencia',function(m){return m.pw||'—'}],['Estilo',function(m){return STYLE_NAME[m.style]}],['Precio',function(m){return price(m)}],['Cuota (20%, 24 meses)',function(m){return money(cuotaOf(m,20,24,35),cur)}]];
        return h('table',null,h('thead',null,h('tr',null,h('th'),ms.map(function(m){return h('td',{key:m.id},m.brand,h('br'),m.model)}))),

      })())));

  var bar=cmp.length>0&&h('div',{className:'cmp-bar'},
    h('div',{className:'items'},cmp.map(function(id){var m=byId(id);return h('span',{key:id},m.brand+' '+m.model)})),

  return h(React.Fragment,null,header,h('main',null,hero,stylesSec,brandsSec,catalog,fin,soat),footer,bar,detailView,cmpView,toast&&h('div',{className:'toast',role:'status'},toast));
}

})();
