<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ingresar · Henvi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="description" content="Ingresa a Henvi para solicitar tu moto y seguir tus pedidos.">
    <link rel="icon" type="image/jpeg" href="/recursos/image/logo.jpeg">
    <link rel="stylesheet" href="/assets/css/panel.css">
</head>
<body class="login-body">
    
    <!-- Luces de fondo (Efecto Premium) -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <a href="/" class="login-brand">
                    <img src="/recursos/image/logo.jpeg" alt="Henvi" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="brand-fallback" style="display:none;">HENVI</span>
                </a>
                <h1 id="t">Bienvenido de nuevo</h1>
                <p id="subtitle" class="text-muted">Ingresa tus credenciales para continuar</p>
            </div>
            
            <form id="f" novalidate>
                
                <!-- Input: Nombre (Oculto por defecto para Login) -->
                <div id="group-nombre" class="form-group" hidden>
                    <label>Nombre completo</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input name="nombre" type="text" placeholder="Ej: Juan Pérez">
                    </div>
                </div>

                <!-- Input: Correo -->
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input name="email" type="email" placeholder="tu@correo.com" required>
                    </div>
                </div>

                <!-- Input: Contraseña -->
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input name="password" type="password" placeholder="••••••••" required minlength="8">
                    </div>
                </div>

                <p id="msg" class="text-red" role="alert" style="font-size: 13px; margin-bottom: 16px; font-weight: 600;"></p>
                
                <button class="btn btn-primary btn-block" id="go" type="submit">Ingresar al sistema</button>
            </form>

            <div class="login-footer">
                <p class="text-muted" id="footer-text">¿No tienes una cuenta?</p>
                <button class="btn-link" id="sw" type="button">Regístrate aquí</button>
            </div>
        </div>
    </div>
    
    <div id="toast"></div>
    
    <script src="/assets/js/core.js"></script>
    <script>
        let reg = false;
        const urlParams = new URLSearchParams(window.location.search);
        const vieneAComprar = urlParams.get('comprar') === 'true';
        // Página a la que volver después de ingresar (solo rutas internas)
        const next = urlParams.get('next');
        const destinoSeguro = next && next.startsWith('/') && !next.startsWith('//') ? next : null;

        if (vieneAComprar) {
            document.getElementById('subtitle').innerHTML = '<b style="color:var(--accent-blue)">¡Estás a un paso!</b><br>Inicia sesión para solicitar tu moto.';
        }

        if (session.user && session.token) location.href = (destinoSeguro && session.user.rol === 'cliente') ? destinoSeguro : HOME[session.user.rol];
        
        const btnSwitch = document.getElementById('sw');
        if(btnSwitch) {
            btnSwitch.onclick = () => {
                reg = !reg;
                // Muestra u oculta el campo nombre
                document.getElementById('group-nombre').hidden = !reg;
                
                document.getElementById('t').textContent = reg ? 'Crea tu cuenta' : 'Bienvenido de nuevo';
                
                if (vieneAComprar && !reg) {
                    document.getElementById('subtitle').innerHTML = '<b style="color:var(--accent-blue)">¡Estás a un paso!</b><br>Inicia sesión para solicitar tu moto.';
                } else {
                    document.getElementById('subtitle').textContent = reg ? 'Regístrate para empezar a comprar' : 'Ingresa tus credenciales para continuar';
                }
                
                document.getElementById('go').textContent = reg ? 'Crear cuenta' : 'Ingresar al sistema';
                document.getElementById('footer-text').textContent = reg ? '¿Ya tienes una cuenta?' : '¿No tienes una cuenta?';
                btnSwitch.textContent = reg ? 'Inicia sesión' : 'Regístrate aquí';
            };
        }
        
        const form = document.getElementById('f');
        if(form) {
            form.onsubmit = async e => {
                e.preventDefault(); 
                document.getElementById('msg').textContent = '';
                const btn = document.getElementById('go');
                btn.disabled = true; btn.textContent = 'Procesando...';

                try {
                    const d = await api(reg ? '/auth/registro' : '/auth/login', { method: 'POST', body: formData(e.target) });
                    session.set(d.token, d.usuario); 
                    
                    if (destinoSeguro && d.usuario.rol === 'cliente') {
                        location.href = destinoSeguro;
                    } else if (vieneAComprar && d.usuario.rol === 'cliente') {
                        location.href = '/cliente/';
                    } else {
                        location.href = HOME[d.usuario.rol];
                    }
                } catch(x) {
                    document.getElementById('msg').textContent = x.message;
                    btn.disabled = false; 
                    btn.textContent = reg ? 'Crear cuenta' : 'Ingresar al sistema';
                }
            };
        }
    </script>
</body>
</html>
