<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ingresar · Moto Altiplano</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="assets/css/panel.css">
</head>
<body>
    <main class="login">
        <div class="card">
            <div class="brand"><i></i>Moto Altiplano</div>
            <h1 id="t">Bienvenido de nuevo</h1>
            <p class="muted" style="text-align:center; margin-top:-1rem; margin-bottom:1.5rem; font-size:0.9rem">Ingresa tus credenciales para continuar</p>
            
            <form id="f" class="grid" style="grid-template-columns:1fr; gap:1.2rem" novalidate>
                <label id="nom" hidden>Nombre completo<input name="nombre" autocomplete="name"></label>
                <label>Correo electrónico<input name="email" type="email" autocomplete="email" required placeholder="tu@correo.com"></label>
                <label>Contraseña<input name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="••••••••"></label>
                <p id="msg" class="err" role="alert"></p>
                <button class="btn" id="go">Ingresar al sistema</button>
            </form>
            <button class="btn ghost" id="sw" type="button" style="margin-top:1rem">Crear cuenta de cliente</button>
        </div>
    </main>
    <div id="toast"></div>
    
    <script src="assets/js/core.js"></script>
    <script>
        let reg = false;
        if (session.user && session.token) location.href = HOME[session.user.rol];
        
        $('#sw').onclick = () => {
            reg = !reg;
            $('#nom').hidden = !reg;
            $('#t').textContent = reg ? 'Crea tu cuenta' : 'Bienvenido de nuevo';
            $('#go').textContent = reg ? 'Crear cuenta' : 'Ingresar al sistema';
            $('#sw').textContent = reg ? 'Ya tengo cuenta' : 'Crear cuenta de cliente';
        };
        
        $('#f').onsubmit = async e => {
            e.preventDefault(); $('#msg').textContent = '';
            try {
                const d = await api(reg ? '/auth/registro' : '/auth/login', { method: 'POST', body: formData(e.target) });
                session.set(d.token, d.usuario); 
                location.href = HOME[d.usuario.rol];
            } catch(x) {
                $('#msg').textContent = x.message;
            }
        };
    </script>
</body>
</html>
