<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ingresar · Moto Altiplano</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
    
    <!-- RUTA ABSOLUTA -->
    <link rel="stylesheet" href="/assets/css/panel.css">
</head>
<body class="login-body">
    
    <div class="login-bg"></div>
    <div class="login-overlay"></div>

    <main class="login-container">
        <div class="login-card">
            <div class="brand">
                <i></i>
                <div>Moto Altiplano<small>Tienda Oficial</small></div>
            </div>
            
            <h1 id="t">Bienvenido de nuevo</h1>
            <p id="subtitle" class="muted" style="text-align:center; margin-bottom:2rem; font-size:0.9rem;">
                Ingresa tus credenciales para continuar
            </p>
            
            <form id="f" class="grid" style="grid-template-columns:1fr; gap:1.2rem" novalidate>
                <label id="nom" hidden>Nombre completo
                    <input name="nombre" autocomplete="name" placeholder="Ej: Juan Pérez">
                </label>
                <label>Correo electrónico
                    <input name="email" type="email" autocomplete="email" required placeholder="tu@correo.com">
                </label>
                <label>Contraseña
                    <input name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="••••••••">
                </label>
                <p id="msg" class="err" role="alert"></p>
                <button class="btn" id="go" style="margin-top:0.5rem">Ingresar al sistema</button>
            </form>
            
            <div class="login-footer">
                <button class="btn ghost" id="sw" type="button">Crear cuenta de cliente</button>
            </div>
        </div>
    </main>
    
    <div id="toast"></div>
    
    <!-- RUTA ABSOLUTA -->
    <script src="/assets/js/core.js"></script>
    <script>
        let reg = false;
        const urlParams = new URLSearchParams(window.location.search);
        const vieneAComprar = urlParams.get('comprar') === 'true';

        if (vieneAComprar) {
            document.getElementById('subtitle').innerHTML = '<b style="color:var(--gold)">¡Estás a un paso!</b><br>Inicia sesión para solicitar tu moto.';
        }

        if (session.user && session.token) location.href = HOME[session.user.rol];
        
        $('#sw').onclick = () => {
            reg = !reg;
            $('#nom').hidden = !reg;
            $('#t').textContent = reg ? 'Crea tu cuenta' : 'Bienvenido de nuevo';
            
            if (vieneAComprar && !reg) {
                $('#subtitle').innerHTML = '<b style="color:var(--gold)">¡Estás a un paso!</b><br>Inicia sesión para solicitar tu moto.';
            } else {
                $('#subtitle').textContent = reg ? 'Regístrate para empezar a comprar' : 'Ingresa tus credenciales para continuar';
            }
            
            $('#go').textContent = reg ? 'Crear cuenta' : 'Ingresar al sistema';
            $('#sw').textContent = reg ? 'Ya tengo cuenta' : 'Crear cuenta de cliente';
        };
        
        $('#f').onsubmit = async e => {
            e.preventDefault(); $('#msg').textContent = '';
            try {
                const d = await api(reg ? '/auth/registro' : '/auth/login', { method: 'POST', body: formData(e.target) });
                session.set(d.token, d.usuario); 
                
                if (vieneAComprar && d.usuario.rol === 'cliente') {
                    location.href = '/cliente/';
                } else {
                    location.href = HOME[d.usuario.rol];
                }
            } catch(x) {
                $('#msg').textContent = x.message;
            }
        };
    </script>
</body>
</html>
